# =====================================================
# Loan Service Configuration
# =====================================================
spring.application.name=ms-lending-app-loan-service
server.port=8083

# R2DBC PostgreSQL
spring.r2dbc.url=r2dbc:postgresql://localhost:5432/lending_loan_db
spring.r2dbc.username=postgres
spring.r2dbc.password=postgres

# Flyway Database Migrations (runs over JDBC at startup, then R2DBC takes over)
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true

# JDBC datasource (used exclusively by Flyway for migrations)
spring.datasource.url=jdbc:postgresql://localhost:5432/lending_loan_db
spring.datasource.username=postgres
spring.datasource.password=postgres
spring.datasource.driver-class-name=org.postgresql.Driver

# Kafka
spring.kafka.bootstrap-servers=localhost:9092
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer
# Idempotent producer — prevents duplicate messages on network retries
spring.kafka.producer.properties.enable.idempotence=true
spring.kafka.producer.acks=all
spring.kafka.producer.retries=3

# Kafka Topics
app.kafka.topic.loan-events=lending.loan.events
app.kafka.topic.partitions=6

# Sweep Job Schedule (runs every hour)
app.sweep.cron=0 0 * * * *

# Saga Recovery (stale threshold in minutes)
app.saga.stale-threshold-minutes=10

# Inter-service URLs
app.service.product-url=http://localhost:8081
app.service.customer-url=http://localhost:8082

# API Key Security
app.security.api-key=loan-service-api-key-2024

# Logging
logging.level.com.glo.lending.loan=DEBUG
logging.level.org.springframework.r2dbc=DEBUG
